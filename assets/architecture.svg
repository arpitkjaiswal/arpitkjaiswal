<title id="title">Architecture of NEXORA, TalentOS, and AegisVault</title><desc id="desc">Three documented application paths: repository analysis, explainable candidate ranking, and policy-aware encrypted document storage. Moving signals illustrate the paths and do not represent live traffic.</desc>
