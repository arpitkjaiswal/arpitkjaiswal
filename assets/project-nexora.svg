<svg xmlns="http://www.w3.org/2000/svg" width="450" height="350" viewBox="0 0 450 350" role="img" aria-labelledby="title desc">
<title id="title">NEXORA — developer tools</title><desc id="desc">Read the codebase. Find what matters. Decorative project illustration.</desc>
<defs>
